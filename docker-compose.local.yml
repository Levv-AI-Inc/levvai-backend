services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: levvai_local
      POSTGRES_USER: levvai
      POSTGRES_PASSWORD: levvai
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U levvai -d levvai_local
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - levvai_local_postgres:/var/lib/postgresql/data

volumes:
  levvai_local_postgres:
